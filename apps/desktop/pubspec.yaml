name: amnezia_proxy_manager
description: 'Кроссплатформенный менеджер локального прокси AmneziaWG.'
publish_to: none
version: 0.1.9+10
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  crypto: ^3.0.6
  http: ^1.5.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  window_manager: 0.5.2
  shared_preferences: ^2.5.6
  screen_retriever: 0.2.2
  archive: 4.0.9
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  tray_manager: 0.8.0
  dbus: 0.7.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_driver:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - assets/branding/
