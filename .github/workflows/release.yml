name: Выпуск приложения
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m unittest discover -s packaging -p 'test_*.py'
      - name: Проверка тега, версии и описания
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py check "$RELEASE_TAG"
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
            arch: x64
          - os: macos-15
            target: macos
            arch: arm64
          - os: ubuntu-24.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Проверки Go
        working-directory: engine
        run: |
          go test ./...
          go vet ./...
      - name: Зависимости Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libx11-dev libxi-dev nftables iproute2 util-linux
      - name: Изолированная проверка блокировки Linux IPv4/IPv6
        if: runner.os == 'Linux'
        working-directory: engine
        run: |
          go test -c -o "$RUNNER_TEMP/apm-fullvpn.test" ./internal/fullvpn
          sudo env APM_RUN_NETWORK_TESTS=1 "$RUNNER_TEMP/apm-fullvpn.test" -test.run '^TestLinuxNftIntegration$' -test.v
      - name: Синтаксис правил PF macOS без изменения сети
        if: runner.os == 'macOS'
        working-directory: engine
        run: APM_VALIDATE_PF=1 go test ./internal/fullvpn -run '^TestPFNativeSyntax$' -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Зависимости Flutter
        working-directory: apps/desktop
        run: flutter pub get
      - name: Проверки Flutter
        working-directory: apps/desktop
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Сборка
        working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          flutter build ${{ matrix.target }} --release --build-name "${version%%-*}"
      - name: Архив Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = 'apps/desktop/build/windows/x64/runner/Release'
          Push-Location engine
          go build -trimpath -o "../$bundle/proxy-engine.exe" ./cmd/proxy-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item Changelog.md $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/AmneziaProxyManager-$env:RELEASE_TAG-windows-x64.zip"
          $version = $env:RELEASE_TAG.Substring(1)
          $numeric = ($version -split '-')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DAppNumericVersion=$numeric" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Архив macOS
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bundle=apps/desktop/build/macos/Build/Products/Release
          (cd engine && go build -trimpath -o ../"$bundle"/proxy-engine ./cmd/proxy-engine)
          cp "$bundle/proxy-engine" "$bundle/amnezia_proxy_manager.app/Contents/MacOS/"
          codesign --force --deep --preserve-metadata=entitlements,requirements,flags --sign - "$bundle/amnezia_proxy_manager.app"
          cp Changelog.md "$bundle/"
          tar -czf "dist/AmneziaProxyManager-$RELEASE_TAG-macos-arm64.tar.gz" -C "$bundle" amnezia_proxy_manager.app proxy-engine Changelog.md
          bash packaging/build-macos.sh
      - name: Архив Linux
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          bundle=apps/desktop/build/linux/x64/release/bundle
          (cd engine && go build -trimpath -o ../"$bundle"/proxy-engine ./cmd/proxy-engine)
          cp Changelog.md "$bundle/"
          tar -czf "dist/AmneziaProxyManager-$RELEASE_TAG-linux-x64.tar.gz" -C "$bundle" .
          bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Установка поверх предыдущей копии и перезапуск Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/check-windows-update.ps1
      - name: Журналы установки Windows
        if: always() && runner.os == 'Windows' && env.WINDOWS_UPDATE_LOG_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-logs
          path: |
            ${{ env.WINDOWS_UPDATE_LOG_DIR }}/*.log
            ${{ env.WINDOWS_UPDATE_LOG_DIR }}/*.json
          if-no-files-found: warn
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Описание и контрольные суммы
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release.py notes "$RELEASE_TAG" --output release-notes.md
          test -s dist/AmneziaProxyManager-Setup-windows-x64.exe
          test -s dist/AmneziaProxyManager-macos-arm64.dmg
          test -s dist/AmneziaProxyManager-linux-x64.run
          (cd dist && sha256sum -- *.zip *.tar.gz *.exe *.dmg *.run > SHA256SUMS.txt)
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Amnezia Proxy Manager $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
