name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m unittest discover -s packaging -p 'test_*.py'
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Проверка Go
        working-directory: engine
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/proxy-engine
          go run ./cmd/proxy-engine --capabilities
      - name: Зависимости Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Зависимости Flutter
        working-directory: apps/desktop
        run: flutter pub get
      - name: Форматирование
        working-directory: apps/desktop
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Анализ Flutter
        working-directory: apps/desktop
        run: flutter analyze
      - name: Тесты Flutter
        working-directory: apps/desktop
        run: flutter test
      - name: Нативная сборка
        working-directory: apps/desktop
        run: flutter build ${{ matrix.target }} --release
